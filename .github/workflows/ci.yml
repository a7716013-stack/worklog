name: Legacy Golden Master
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and record evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/build.sha
          dotnet --info > evidence/dotnet-info.txt
          uname -a > evidence/os.txt
          dotnet build WorkJournal.sln -c Release 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-build
          path: evidence/
  legacy-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Deterministic checks (no provider probes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/legacy-fast.sha
          dotnet --info > evidence/fast-dotnet-info.txt
          for project in MarketRadarChecks FinMindChecks FinMindChecks/LegacySwing75Checks; do
            dotnet run --project "tests/$project" -c Release 2>&1 | tee "evidence/${project##*/}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-fast
          path: evidence/
  legacy-sql:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: EphemeralOnly!Legacy201
        ports:
          - 1433:1433
    env:
      WORKJOURNAL_TEST_SQL: 'Server=localhost,1433;User ID=sa;Password=EphemeralOnly!Legacy201;Encrypt=True;TrustServerCertificate=True;'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for disposable SQL Server
        shell: bash
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EphemeralOnly!Legacy201' -C -Q 'SELECT 1' > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs "$SQL_CONTAINER"
          exit 1
      - name: SQL integration checks with GUID databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/legacy-sql.sha
          dotnet --info > evidence/sql-dotnet-info.txt
          for project in PaperTradingChecks StrategyCenterChecks MarketRadarTrackingChecks; do
            dotnet run --project "tests/$project" -c Release 2>&1 | tee "evidence/$project.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-sql
          path: evidence/
  v2-foundation:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: EphemeralOnly!Legacy201
        ports:
          - 1433:1433
    env:
      WORKJOURNAL_TEST_SQL: 'Server=localhost,1433;User ID=sa;Password=EphemeralOnly!Legacy201;Encrypt=True;TrustServerCertificate=True;'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for disposable SQL Server
        shell: bash
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EphemeralOnly!Legacy201' -C -Q 'SELECT 1' > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs "$SQL_CONTAINER"
          exit 1
      - name: V2 foundation checks with GUID database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v2-foundation.sha
          dotnet --info > evidence/sql-dotnet-info.txt
          for project in V2FoundationChecks; do
            dotnet run --project "tests/$project" -c Release 2>&1 | tee "evidence/$project.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v2-foundation
          path: evidence/
  v2-evidence:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: EphemeralOnly!Legacy201
        ports:
          - 1433:1433
    env:
      WORKJOURNAL_TEST_SQL: 'Server=localhost,1433;User ID=sa;Password=EphemeralOnly!Legacy201;Encrypt=True;TrustServerCertificate=True;'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Wait for disposable SQL Server
        shell: bash
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EphemeralOnly!Legacy201' -C -Q 'SELECT 1' > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs "$SQL_CONTAINER"
          exit 1
      - name: Phase 3 partial contracts, aggregation and PIT preparation checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v2-evidence.sha
          dotnet --info > evidence/sql-dotnet-info.txt
          for project in V2EvidenceChecks; do
            dotnet run --project "tests/$project" -c Release 2>&1 | tee "evidence/$project.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v2-evidence
          path: evidence/
  v3-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Candidate mathematics, PIT isolation and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v3-model.sha
          dotnet run --project tests/V3ModelChecks -c Release 2>&1 | tee evidence/v3-model.log
          dotnet build src/WorkJournal.Evidence.Cli -c Release 2>&1 | tee evidence/v3-cli.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v3-model
          path: evidence/
  v3-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Research protocol, mathematics, PIT, OOS, persistence and replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v3-research.sha
          dotnet run --project tests/V3ResearchChecks -c Release 2>&1 | tee evidence/v3-research.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v3-research
          path: evidence/
  v3-pit-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Historical dataset guards, archive replay and shared research adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v3-pit-dataset.sha
          dotnet run --project tests/V3PitDatasetChecks -c Release 2>&1 | tee evidence/v3-pit-dataset.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v3-pit-dataset
          path: evidence/
  v3-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Authority review, approval scope, evidence integrity and research guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/v3-authority.sha
          dotnet run --project tests/V3AuthorityChecks -c Release 2>&1 | tee evidence/v3-authority.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v3-authority
          path: evidence/
  legacy-golden-master:
    if: always()
    needs: [build, legacy-fast, legacy-sql, v2-foundation, v2-evidence, v3-model, v3-research, v3-pit-dataset, v3-authority]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-*
          path: evidence
          merge-multiple: true
      - name: Require successful jobs at the same SHA
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FAST_RESULT: ${{ needs.legacy-fast.result }}
          SQL_RESULT: ${{ needs.legacy-sql.result }}
          V2_RESULT: ${{ needs.v2-foundation.result }}
          EVIDENCE_RESULT: ${{ needs.v2-evidence.result }}
          MODEL_RESULT: ${{ needs.v3-model.result }}
          RESEARCH_RESULT: ${{ needs.v3-research.result }}
          PIT_RESULT: ${{ needs.v3-pit-dataset.result }}
          AUTHORITY_RESULT: ${{ needs.v3-authority.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, datetime
          jobs = {k: os.environ[k] for k in ('BUILD_RESULT', 'FAST_RESULT', 'SQL_RESULT', 'V2_RESULT', 'EVIDENCE_RESULT', 'MODEL_RESULT', 'RESEARCH_RESULT', 'PIT_RESULT', 'AUTHORITY_RESULT')}
          shas = {k: pathlib.Path('evidence', k+'.sha').read_text().strip() for k in ('build', 'legacy-fast', 'legacy-sql', 'v2-foundation', 'v2-evidence', 'v3-model', 'v3-research', 'v3-pit-dataset', 'v3-authority')}
          passed = all(v == 'success' for v in jobs.values()) and all(v == os.environ['EXPECTED_SHA'] for v in shas.values())
          report = dict(commitSHA=os.environ['EXPECTED_SHA'], workflowRunId=os.environ['GITHUB_RUN_ID'], runner=os.environ['RUNNER_OS'], timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(), jobs=jobs, shas=shas, browserTests='NOT_PART_OF_GATE', externalProbe='NOT_PART_OF_GATE', status='PASS' if passed else 'FAIL')
          pathlib.Path('evidence/golden-master.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-master-evidence
          path: evidence/
