name: Publish version
on:
  push:
    branches: [main]
    paths: [src/WorkJournal.Web/WorkJournal.Web.csproj]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-version
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for the project version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/src/WorkJournal.Web/WorkJournal.Web.csproj?ref=$COMMIT_SHA" --jq .content | base64 --decode > project.xml
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("project.xml").findtext(".//Version") or "")')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid project version"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; preserving it."
            exit 0
          fi
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$COMMIT_SHA" --jq .content | base64 --decode > notes.md
          gh release create "v$VERSION" --target "$COMMIT_SHA" --title "WorkJournal v$VERSION" --notes-file notes.md
